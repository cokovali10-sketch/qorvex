[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qorvex-scanners"
version = "0.2.0"
description = "Qorvex code analysis scanners"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
full = [
    "semgrep>=1.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.0",
]

[project.scripts]
qorvex-scan = "scanners.cli:main"

[tool.setuptools.packages.find]
include = ["scanners*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
