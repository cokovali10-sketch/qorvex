name: Qorvex CI/CD

on:
  push:
    branches: [master, main, release]
  pull_request:
    branches: [master, main]
  release:
    types: [published]

jobs:
  # Lint static analysis
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [go, python, typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: matrix.language == 'go'
        run: go vet ./...

        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install pytest coverage

        if: matrix.language == 'typescript'
        run: cd ts && npm ci

      - name: Lint Go
        if: matrix.language == 'go'
        run: |
          golangci-lint run --timeout 5m ./pkg/...
          go vet ./...

      - name: Lint Python
        if: matrix.language == 'python'
        run: |
          python -m pylint python/ --disable=R,C
          cd python && python -m pytest tests -q

      - name: Lint TypeScript
        if: matrix.language == 'typescript'
        run: |
          cd ts
          npm run lint
          npm run build

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        package: [go-python, typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.package == 'go-python'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Python
        if: matrix.package == 'go-python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Go tests
        if: matrix.package == 'go-python'
        run: go test ./pkg/... -count=1 -race

      - name: Run Python tests
        if: matrix.package == 'go-python'
        run: cd python && python -m pytest tests -q -v

      - name: Run TypeScript tests
        if: matrix.package == 'typescript'
        run: cd ts && npm test

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run security tests
        run: |
          go test -tags=security ./pkg/orchestrator/... -count=1
          # Run semgrep if available
          which semgrep && semgrep --config auto --rc filledMode=overwrite . || true

      - name: Dependency vulnerability scan
        run: |
          # Check for known vulnerabilities in Go dependencies
          go list -m -json all | grep -E "(CVE|VULN)" || echo "No known vulnerabilities in go.mod"
          # Check Python dependencies
          cd python && pip-audit --format=table --summary || true

  docker:
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: qemu/actions/setup-qemu@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: cokovali10-sketch
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cokovali10-sketch/qorvex:latest
            ghcr.io/cokovali10-sketch/qorvex:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Use multi-stage build
          target: qorvex-prod

      - name: Export image digest
        run: |
          echo "IMAGE_DIGEST=$(docker inspect ghcr.io/cokovali10-sketch/qorvex:latest --format='{{index .RepoDigests 0}}')" >> $GITHUB_ENV

  # Release job
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        run: |
          echo "Qorvex v$(grep version go.mod | cut -d' ' -f2) released" > release-notes.txt
          git log --oneline -5 >> release-notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.ref_name }}
          name: "Qorvex v${{ github.ref_name }}"
          body: |
            ## What's New

            Generated from commit ${{ github.sha }}.

            ## Changed

            - Various improvements and bug fixes.

            ## Security

            - Fail-closed security policy enforced.
            - HMAC audit log verified on each request.

          draft: false
          prerelease: false