[package]
name = "qorvex-executor"
version = "0.1.0"
edition = "2021"
description = "Qorvex Execution Engine — secure sandbox for untrusted code"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
linux_sandbox = []  # requires Linux for namespaces/seccomp

[profile.release]
opt-level = 3
lto = true